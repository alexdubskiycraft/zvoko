<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Zvoko - купуй та куштуй =){% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    
    <style>
        body {
            background-color: #121212;
            color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar-custom {
            background-color: #000000;
            border-bottom: 2px solid #ffc107;
        }

        .navbar-brand-custom {
            color: #ffc107 !important;
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        .nav-link-custom {
            color: #ffffff !important;
            font-weight: 500;
            transition: color 0.2s ease-in-out;
        }

        .nav-link-custom:hover {
            color: #ffc107 !important;
        }

        .btn-zvoko {
            background-color: #ffc107;
            color: #000000;
            font-weight: 700;
            border: 1px solid #ffc107;
            transition: all 0.2s ease-in-out;
        }

        .btn-zvoko:hover {
            background-color: #e0a800;
            border-color: #d39e00;
            color: #000000;
        }

        .btn-zvoko-outline {
            background-color: transparent;
            color: #ffc107;
            font-weight: 600;
            border: 1px solid #ffc107;
            transition: all 0.2s ease-in-out;
        }

        .btn-zvoko-outline:hover {
            background-color: #ffc107;
            color: #000000;
        }

        main.content-container {
            background-color: #1e1e1e;
            border: 1px solid #333333;
            border-top: 3px solid #ffc107;
            color: #e0e0e0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .card-zvoko {
            background-color: #161616;
            border: 1px solid #333333;
            border-top: 3px solid #ffc107;
            color: #f8f9fa;
        }

        .zvoko-form p {
            margin-bottom: 1rem;
        }

        .zvoko-form label {
            display: block;
            margin-bottom: 0.4rem;
            color: #ffc107;
            font-weight: 500;
        }

        .zvoko-form input[type="text"],
        .zvoko-form input[type="password"],
        .zvoko-form input[type="email"] {
            width: 100%;
            padding: 0.5rem 0.75rem;
            background-color: #252525;
            border: 1px solid #444444;
            border-radius: 0.375rem;
            color: #ffffff;
        }

        .zvoko-form input:focus {
            outline: none;
            border-color: #ffc107;
            box-shadow: 0 0 0 0.2rem rgba(255, 193, 7, 0.25);
        }

        .zvoko-form .helptext {
            display: block;
            font-size: 0.8rem;
            color: #9e9e9e;
            margin-top: 0.25rem;
        }

        .zvoko-form ul.errorlist {
            list-style: none;
            padding: 0;
            margin: 0.25rem 0 0.5rem 0;
            color: #ff6b6b;
            font-size: 0.875rem;
        }

        .footer-custom {
            background-color: #000000;
            border-top: 1px solid #333333;
            color: #ffc107;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand navbar-brand-custom" href="/">
                <img src="/media/base/ZvokoLogo.png" alt="Zvoko" width="90px">
            </a>
            <button class="navbar-toggler border-warning" type="button" data-bs-toggle="collapse" 
                    data-bs-target="#navbarNav" aria-controls="navbarNav" 
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-2">
                    <li class="nav-item">
                        <a class="nav-link nav-link-custom" href="{% url 'category_list' %}">Категорії товарів</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link nav-link-custom d-flex align-items-center gap-1" href="{% url 'cart' %}">
                            Кошик
                            <span id="cart-count" class="badge rounded-pill bg-warning text-dark">0</span>
                        </a>
                    </li>

                    {% if user.is_authenticated %}
                        <li class="nav-item">
                            <span class="nav-link text-warning fw-semibold">
                                Привіт, {{ user.username }}!
                            </span>
                        </li>
                        <li class="nav-item">
                            <form method="post" action="{% url 'logout' %}" class="d-inline">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-sm btn-zvoko-outline">Вийти</button>
                            </form>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="btn btn-sm btn-zvoko-outline" href="{% url 'login' %}">Увійти</a>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-sm btn-zvoko" href="{% url 'signup' %}">Реєстрація</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4 p-4 rounded content-container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer-custom text-center py-3 mt-4">
        Zvoko shop @ 2026
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch("{% url 'total_products_in_cart' %}")
                .then(response => response.json())
                .then(data => {
                    document.getElementById('cart-count').textContent = data.total;
                })
                .catch(error => console.error('Помилка отримання кошика:', error));
        });
    </script>
</body>
</html>
